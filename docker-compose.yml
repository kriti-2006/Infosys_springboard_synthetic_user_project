# One-command local database:  docker compose up -d
# Image bundles PostgreSQL 16 + the pgvector extension.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: persona_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
      POSTGRES_DB: persona_platform
    ports:
      - "5433:5432"
    volumes:
      - persona_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  persona_pgdata:
